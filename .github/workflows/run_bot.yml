name: Run TikTok Bot

on:
  workflow_dispatch: # يتيح لك تشغيل السكريبت يدوياً بضغطة زر من تطبيق أو موقع GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Bot Script
        run: |
          python bot.py
