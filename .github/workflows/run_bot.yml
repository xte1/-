name: Run TikTok Bot

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: 'رابط الفيديو'
        required: true
        type: string
      service_type:
        description: 'نوع الخدمة (views, likes, comments)'
        required: true
        type: string
      quantity:
        description: 'العدد المطلوب'
        required: true
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Bot Script
        env:
          POST_URL: ${{ github.event.inputs.post_url }}
          SERVICE_TYPE: ${{ github.event.inputs.service_type }}
          QUANTITY: ${{ github.event.inputs.quantity }}
        run: |
          python bot.py
