<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة حسابات تيك توك</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .back-btn {
            background-color: var(--border-color);
            text-align: center;
            display: block;
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
        }

        .accounts-list {
            margin-top: 20px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>إدارة وإضافة الحسابات</h2>

        <form id="addAccountForm" onsubmit="saveAccount(event)">
            <div class="form-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="accUsername" placeholder="@username" required>
            </div>

            <div class="form-group">
                <label>رمز الجلسة أو الرمز (Session / Password)</label>
                <input type="text" id="accSession" placeholder="أدخل الرمز أو الـ Session ID" required>
            </div>

            <button type="submit" class="btn">حفظ وإضافة الحساب</button>
        </form>

        <h4 style="margin-top: 20px; margin-bottom: 10px;">الحسابات المضافة حالياً:</h4>
        <div class="accounts-list" id="accountsListContainer">
            <!-- سيتم عرض الحسابات هنا -->
        </div>

        <br>
        <a href="index.html" class="back-btn">العودة إلى لوحة الرشق الرئيسية</a>
    </div>

    <script>
        // استرجاع الحسابات المحفوظة
        let savedAccounts = JSON.parse(localStorage.getItem('tiktok_accounts')) || [];

        function renderAccounts() {
            const container = document.getElementById('accountsListContainer');
            container.innerHTML = '';
            
            if (savedAccounts.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 10px;">لا توجد حسابات مضافة بعد</div>';
                return;
            }

            savedAccounts.forEach((acc, index) => {
                container.innerHTML += `
                    <div class="account-item">
                        <span>${index + 1}. ${acc.username}</span>
                        <button class="delete-btn" onclick="deleteAccount(${index})">حذف</button>
                    </div>
                `;
            });
        }

        function saveAccount(event) {
            event.preventDefault();
            const username = document.getElementById('accUsername').value;
            const session = document.getElementById('accSession').value;

            savedAccounts.push({ username, session });
            localStorage.setItem('tiktok_accounts', JSON.stringify(savedAccounts));

            document.getElementById('addAccountForm').reset();
            renderAccounts();
            alert('تم حفظ الحساب بنجاح!');
        }

        function deleteAccount(index) {
            savedAccounts.splice(index, 1);
            localStorage.setItem('tiktok_accounts', JSON.stringify(savedAccounts));
            renderAccounts();
        }

        window.onload = renderAccounts;
    </script>
</body>
</html>
