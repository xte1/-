<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Services Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .accounts-info {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--success-color);
            margin-bottom: 15px;
            text-align: center;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>لوحة خدمات تيك توك</h2>

        <!-- عداد الحسابات المضافة -->
        <div class="accounts-info" id="accountsCounter">
            عدد الحسابات المضافة في النظام: 0 حساب
        </div>

        <form id="serviceForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="username" placeholder="@username" required>
            </div>

            <div class="form-group">
                <label>رابط المنشور (فيديو أو صور)</label>
                <input type="url" id="postUrl" placeholder="https://www.tiktok.com/@user/video/..." required>
            </div>

            <div class="form-group">
                <label>اختر نوع الخدمة</label>
                <select id="serviceType" onchange="toggleCommentsField()" required>
                    <option value="" disabled selected>-- اختر الخدمة --</option>
                    <option value="views">رشق مشاهدات</option>
                    <option value="likes">رشق لايكات</option>
                    <option value="comments">رشق تعليقات</option>
                    <option value="followers">رشق متابعين</option>
                    <option value="shares">رشق مشاركات</option>
                    <option value="saves">رشق حفظ</option>
                </select>
            </div>

            <!-- حقل إدخال التعليقات يظهر فقط عند اختيار التعليقات -->
            <div class="form-group hidden" id="commentsGroup">
                <label>اكتب التعليقات (كل تعليق في سطر منفصل)</label>
                <textarea id="commentsText" placeholder="رائع جداً&#10;استمر&#10;جميل"></textarea>
            </div>

            <div class="form-group">
                <label>العدد المطلوب (حسب الحسابات المضافة)</label>
                <input type="number" id="quantity" placeholder="أدخل العدد" min="1" required>
            </div>

            <button type="submit" class="submit-btn">تنفيذ الطلب</button>
        </form>
    </div>

    <!-- ملف الحسابات المضافة داخل المشروع -->
    <script src="accounts.js"></script>

    <script>
        // تحديث عدد الحسابات تلقائياً من ملف accounts.js
        window.onload = function() {
            if (typeof systemAccounts !== 'undefined') {
                document.getElementById('accountsCounter').innerText = `عدد الحسابات المضافة في النظام: ${systemAccounts.length} حساب`;
            }
        };

        function toggleCommentsField() {
            const serviceType = document.getElementById('serviceType').value;
            const commentsGroup = document.getElementById('commentsGroup');
            if (serviceType === 'comments') {
                commentsGroup.classList.remove('hidden');
            } else {
                commentsGroup.classList.add('hidden');
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            const service = document.getElementById('serviceType').value;
            const qty = parseInt(document.getElementById('quantity').value);
            
            // التحقق من أن العدد لا يتجاوز عدد الحسابات المضافة في النظام
            if (typeof systemAccounts !== 'undefined' && qty > systemAccounts.length) {
                alert(`عذراً، العدد المطلوب (${qty}) أكبر من عدد الحسابات المتاحة في النظام (${systemAccounts.length})!`);
                return;
            }

            alert('تم استلام طلبك بنجاح وجاري تنفيذه عبر الحسابات المتاحة!');
            document.getElementById('serviceForm').reset();
            toggleCommentsField();
        }
    </script>
</body>
</html>
